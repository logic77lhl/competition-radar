name: radar

# 每天 01:00 UTC = 北京时间 09:00，和本地计划任务同一个时间点。
# GitHub 的定时任务会排队，实际可能晚几分钟到半小时。
on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "radar.mjs"
      - "lib/**"
      - "panel/**"
      - "tools/**"
      - "config.json"
      - "curated.json"
      - ".github/workflows/radar.yml"

permissions:
  contents: read

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 提交台账与导出的站点
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 退出码 2 = 所有来源都失败。这一步失败就不要往下走，
      # 宁可站点停在昨天，也不要发布一份「今天没有新赛事」的假数据。
      - name: 采集
        run: node radar.mjs

      - name: 导出静态站点
        run: node tools/export-static.mjs

      - name: 提交台账与站点
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/registry.json state/source-state.json state/history.jsonl docs
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "data: $(date -u +%F) 采集"
            git push
          fi

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
